# Render Blueprint - Deploy all services with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: opendota-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: CLAUDE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: MCP_SERVER_URL
        sync: false  # Set to your MCP server URL after deploying it
      - key: FRONTEND_URL
        sync: false  # Set to your frontend URL after deploying it

  # Frontend Static Site
  - type: web
    name: opendota-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your backend URL after deploying it
